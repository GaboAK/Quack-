<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monedero</title>
    <link rel="stylesheet" href="/Visuals/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Michroma&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>MONEDERO</h1>
    <p>HERRAMIENTA PARA ALMACENAMIENTO EN CAJAS</p>

    <div class="content">
        <form id="formPR">
            <h2>INGRESO</h2>
            <label for="name">CATEGORIA:</label>
            <input type="text" id="name" name="name" required>
            <br>

            <label for="coin">NOMBRE DE LA MONEDA:</label>
            <input type="text" id="coin" name="coin" required>
            <br>

            <label for="quantity">CANTIDAD:</label>
            <input type="number" id="quantity" name="quantity" required>
            <br>

            <button type="submit">GUARDAR</button>
        </form>

    </div>


</body>

</html>
